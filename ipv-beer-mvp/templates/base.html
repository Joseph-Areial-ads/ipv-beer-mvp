<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IPV Beer | Gestão</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header>
  <div class="brand">IPV <span>Beer</span></div>
  <nav>
    <a href="{{ url_for('index') }}">Início</a>
    <a href="{{ url_for('customers') }}">Clientes</a>
    <a href="{{ url_for('orders') }}">Pedidos</a>
  </nav>
</header>
<main>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
        <div class="notice {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
<footer>IPV Beer · MVP acadêmico de gerenciamento</footer>
</body>
</html>
